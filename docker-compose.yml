services:
  # DynamoDB Local (Serviço NoSQL local para avaliações)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: viaja-junto-dynamodb
    hostname: dynamodb-local
    restart: always
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DynamoDB Admin GUI (Interface Web para visualizar tabelas e itens no browser)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: viaja-junto-dynamodb-admin
    restart: always
    ports:
      - "8002:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=fakeAccessKey
      - AWS_SECRET_ACCESS_KEY=fakeSecretKey
    depends_on:
      - dynamodb-local

volumes:
  dynamodb_data:
