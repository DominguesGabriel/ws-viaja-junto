name: CI - Build, Test & Coverage

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    name: Run Tests and Generate Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for gradlew/mvnw
        run: chmod +x mvnw

      - name: Validate OpenAPI Contract with Spectral
        uses: stoplightio/spectral-action@v0.8.10
        with:
          file_glob: 'openapi.yaml'
          spectral_ruleset: '.spectral.yaml'

      - name: Run automated tests with JaCoCo
        run: ./mvnw clean verify

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Add JaCoCo PR Summary
        if: always()
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 90
          title: "📊 Relatório de Cobertura de Código (JaCoCo)"
          update-comment: true

      - name: Build Docker Image
        run: |
          docker build -t viaja-junto-api:${{ github.sha }} .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: 'viaja-junto-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'


