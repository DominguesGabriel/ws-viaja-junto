name: SonarQube Analysis

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  sore-sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o Sonar analisar o histórico de commits corretamente

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests and Generate Coverage (JaCoCo)
        run: mvn clean test jacoco:report

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${< secrets.SONAR_TOKEN >}
          SONAR_HOST_URL: ${< secrets.SONAR_HOST_URL >} # Opcional se usar o SonarCloud oficial

      # Opcional: Garante que o workflow falha se o Quality Gate for reprovado
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${< secrets.SONAR_TOKEN >}
