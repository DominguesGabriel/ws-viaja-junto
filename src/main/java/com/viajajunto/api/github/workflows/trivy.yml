name: Trivy Security Scan

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  trivy-scan:
    name: Build and Scan with Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t viajajunto-api:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'viajajunto-api:latest'
          format: 'table'
          exit-code: '1' # Falha o job se encontrar vulnerabilidades correspondentes
          severity: 'HIGH,CRITICAL'