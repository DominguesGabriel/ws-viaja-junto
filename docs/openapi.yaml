openapi: 3.0.3
info:
  title: ViajaJunto API
  description: Contrato da API do projeto ViajaJunto
  version: 1.0.0
  contact:
    name: Equipe ViajaJunto
    email: contato@viajajunto.com
servers:
  - url: http://localhost:8080
    description: Servidor Local
tags:
  - name: Health
    description: Operações de verificação de saúde da aplicação
paths:
  /api/v1/status:
    get:
      summary: Retorna o status da API
      description: Endpoint para checagem de saúde e status operacional do serviço
      operationId: getApiStatus
      tags:
        - Health
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
